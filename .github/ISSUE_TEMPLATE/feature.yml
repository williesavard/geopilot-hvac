name: Feature request
description: Propose an improvement to GeoPilot.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior, alternatives, and any safety implications.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend
        - Documentation
        - Firmware
        - Hardware
        - Home Assistant
        - Tooling
        - Other
    validations:
      required: true
