[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geopilot"
version = "0.1.0"
description = "Local-first foundation for residential HVAC monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "GeoPilot contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<3",
  "pre-commit>=3.7,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
modbus = [
  "pyserial>=3.5,<4",
]

[project.urls]
Repository = "https://github.com/williesavard/GeoPilot"
Issues = "https://github.com/williesavard/GeoPilot/issues"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
